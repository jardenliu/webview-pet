# Publish to npm when a version tag (v*) is pushed.
#
# Auth: npm Trusted Publishing (OIDC) — no long-lived token stored in GitHub.
# One-time setup on npmjs.com → webview-pet → Settings → Trusted Publisher:
#   provider: GitHub Actions
#   user: jardenliu
#   repo: webview-pet
#   workflow filename: publish.yml   (must match this file's name exactly)
# Note: the first publish through this workflow must succeed within 2 days of
# saving the trusted publisher config, or the config expires.
#
# Release flow: npm version patch && git push --follow-tags
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test tests/

      # prepublishOnly (bun run build && bun test tests/) runs automatically here
      # Prereleases (x.y.z-alpha.N) go to their own dist-tag (alpha/beta/rc…)
      # so `npm install webview-pet` keeps resolving to the latest stable.
      - name: Publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already exists on npm, skipping publish"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"; TAG="${TAG%%.*}"
            echo "Publishing prerelease $VERSION to dist-tag @$TAG"
            npm publish --tag "$TAG"
          else
            echo "Publishing stable $VERSION to dist-tag @latest"
            npm publish
          fi
